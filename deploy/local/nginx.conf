server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the Compose service again after backend container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    # Longer than the browser generation request limit of at least 330 seconds.
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    # Match Spring's multipart max-request-size so oversized uploads get the backend's JSON 413.
    client_max_body_size 2m;
    # Bodies over that limit stop here; answer with the same JSON envelope instead of nginx's HTML page.
    error_page 413 @content_too_large;

    location @content_too_large {
        default_type application/json;
        return 413 '{"request_id":null,"error":{"code":"CONTENT_TOO_LARGE","message":"Content Too Large","retryable":false}}';
    }

    location ^~ /api/ {
        proxy_pass $backend_origin$request_uri;
    }

    location = /api {
        proxy_pass $backend_origin$request_uri;
    }

    location = /health {
        proxy_pass $backend_origin$request_uri;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Saved chat and evidence links must also work on a fresh page load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
