# Local live AI stack. Only the web UI is published on the loopback interface.
# Use compose.test.yaml as a second file for key-free deterministic chat tests.
name: negopilot-local

x-app-environment: &app-environment
  APP_DATABASE_URL: jdbc:postgresql://postgres:5432/negopilot_app
  APP_DATABASE_USER: negopilot_app
  APP_DATABASE_PASSWORD: ${APP_DB_PASSWORD:-local-app-password}

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/local/backend.Dockerfile

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/local/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-app-password}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:-local-business-password}
      BUSINESS_READER_PASSWORD: ${BUSINESS_READER_PASSWORD:-local-reader-password}
      MAIL_READER_PASSWORD: ${MAIL_READER_PASSWORD:-local-mail-reader-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  admin-bootstrap:
    build: *backend-build
    image: ${COMPOSE_PROJECT_NAME:-negopilot-local}-backend:local
    environment:
      <<: *app-environment
      ADMIN_BOOTSTRAP_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-LocalAdmin2026!}
    command:
      - -Dloader.main=com.negopilot.backend.AuthBootstrapAdmin
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
      - --if-absent
      - --email=${LOCAL_ADMIN_EMAIL:-admin@negopilot.local}
      - --name=로컬 관리자
      - --department=개발팀
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-bootstrap:
    build: *backend-build
    image: ${COMPOSE_PROJECT_NAME:-negopilot-local}-backend:local
    environment:
      <<: *app-environment
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-user@negopilot.local}
      LOCAL_USER_PASSWORD: ${LOCAL_USER_PASSWORD:-LocalUser2026!}
    command:
      - -Dloader.main=com.negopilot.backend.AuthBootstrapLocalUser
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    depends_on:
      postgres:
        condition: service_healthy
      admin-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  business-mcp:
    build:
      context: .
      dockerfile: deploy/local/business.Dockerfile
    environment:
      PGPASSWORD: ${BUSINESS_READER_PASSWORD:-local-reader-password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 9102), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  law-mcp:
    build:
      context: .
      dockerfile: deploy/local/law.Dockerfile
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 9103), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  mail-mcp:
    build:
      context: .
      dockerfile: deploy/local/mail.Dockerfile
    environment:
      PGPASSWORD: ${MAIL_READER_PASSWORD:-local-mail-reader-password}
      # 미리보기 확인 토큰 서명 키. 로컬 기본값은 공개 값이라 실제 발송 환경에서는 반드시 바꾼다
      MAIL_CONFIRM_SECRET: ${MAIL_CONFIRM_SECRET:-local-mail-confirm-secret-not-for-production}
      # dry_run이면 실제로 보내지 않고 보낼 메일을 돌려준다
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-dry_run}
      SMTP_HOST: ${SMTP_HOST-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME-}
      SMTP_PASSWORD: ${SMTP_PASSWORD-}
      MAIL_FROM: ${MAIL_FROM:-purchasing@negopilot.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NegoPilot 구매팀}
      MAIL_BUYER_NAME: ${MAIL_BUYER_NAME:-NegoPilot}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO-}
    volumes:
      - mail-data:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 9104), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # 메일 확인용 SMTP 서버. 받은 메일을 배달하지 않고 http://localhost:8025 에서 보여 준다
  # docker compose --profile mailpit up -d 후 MAIL_TRANSPORT=smtp SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_SECURITY=none
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mailpit]
    ports:
      - "127.0.0.1:8025:8025"

  agent:
    build:
      context: .
      dockerfile: deploy/local/agent.Dockerfile
    environment:
      AGENT_EXECUTION_MODE: live
      AGENT_INTERNAL_API_KEY: ${LOCAL_AGENT_API_KEY:-local-agent-test-key}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-300}
      NEGOPILOT_DECOMPOSER_BACKEND: ${NEGOPILOT_DECOMPOSER_BACKEND-openai}
      # Empty MODEL selects this provider's core default (OpenAI: gpt-4.1-mini).
      NEGOPILOT_DECOMPOSER_MODEL: ${NEGOPILOT_DECOMPOSER_MODEL-}
      NEGOPILOT_DECOMPOSER_EFFORT: ${NEGOPILOT_DECOMPOSER_EFFORT-low}
      NEGOPILOT_DECOMPOSER_FALLBACKS: ${NEGOPILOT_DECOMPOSER_FALLBACKS-1}
      NEGOPILOT_GENERATOR_BACKEND: ${NEGOPILOT_GENERATOR_BACKEND-openai}
      NEGOPILOT_GENERATOR_MODEL: ${NEGOPILOT_GENERATOR_MODEL-}
      NEGOPILOT_GENERATOR_EFFORT: ${NEGOPILOT_GENERATOR_EFFORT-medium}
      NEGOPILOT_GENERATOR_FALLBACKS: ${NEGOPILOT_GENERATOR_FALLBACKS-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-4096}
      BUSINESS_MCP_URL: http://business-mcp:9102/mcp
      LAW_MCP_URL: http://law-mcp:9103/mcp
      # LangSmith tracing is off unless both TRACING=true and a key are set. It sends prompts and tool data out.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-negopilot}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-false}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      business-mcp:
        condition: service_healthy
      law-mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  backend:
    build: *backend-build
    image: ${COMPOSE_PROJECT_NAME:-negopilot-local}-backend:local
    environment:
      <<: *app-environment
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SESSION_COOKIE_SECURE: "false"
      AGENT_BASE_URL: http://agent:9200
      AGENT_INTERNAL_API_KEY: ${LOCAL_AGENT_API_KEY:-local-agent-test-key}
      AGENT_EXECUTION_MODE: live
      AGENT_RESPONSE_TIMEOUT_SECONDS: ${AGENT_RESPONSE_TIMEOUT_SECONDS:-310}
      BUSINESS_DATABASE_ENABLED: "true"
      BUSINESS_DATABASE_URL: jdbc:postgresql://postgres:5432/negopilot_business
      BUSINESS_DATABASE_USER: negopilot_business_owner
      BUSINESS_DATABASE_PASSWORD: ${BUSINESS_DB_PASSWORD:-local-business-password}
      # 협상 문서 내보내기 파일. 컨테이너를 다시 만들어도 남도록 볼륨에 둔다
      NEGOTIATION_EXPORT_DIR: /app/var/negotiation-exports
    volumes:
      - negotiation-exports:/app/var/negotiation-exports
    command: [-jar, /app/app.jar]
    depends_on:
      postgres:
        condition: service_healthy
      admin-bootstrap:
        condition: service_completed_successfully
      user-bootstrap:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/local/frontend.Dockerfile
    ports:
      - "127.0.0.1:${LOCAL_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  mail-data:
  negotiation-exports:
