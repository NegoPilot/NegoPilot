spring.application.name=negopilot-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF
agent.base-url=${AGENT_BASE_URL:http://127.0.0.1:9200}
agent.internal-api-key=${AGENT_INTERNAL_API_KEY:}
agent.connect-timeout=${AGENT_CONNECT_TIMEOUT_SECONDS:2}s
agent.response-timeout=${AGENT_RESPONSE_TIMEOUT_SECONDS:35}s
agent.execution-mode=${AGENT_EXECUTION_MODE:live}
spring.datasource.url=${APP_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/negopilot_app}
spring.datasource.username=${APP_DATABASE_USER:negopilot_app}
spring.datasource.password=${APP_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.locations=classpath:db/migration
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
business.datasource.enabled=${BUSINESS_DATABASE_ENABLED:false}
business.datasource.url=${BUSINESS_DATABASE_URL:}
business.datasource.username=${BUSINESS_DATABASE_USER:}
business.datasource.password=${BUSINESS_DATABASE_PASSWORD:}
negotiation.export-dir=${NEGOTIATION_EXPORT_DIR:./var/negotiation-exports}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
legal-review-upload.concurrency=${LEGAL_REVIEW_UPLOAD_CONCURRENCY:2}
legal-review-upload.max-pending-per-user=${LEGAL_REVIEW_UPLOAD_MAX_PENDING_PER_USER:30}
