[project]
name = "negopilot-shared"
version = "0.1.0"
description = "NegoPilot 컴포넌트 간 공용 계약: 쿼리 분해 결과 스키마와 intent 등록표"
authors = [
    { name = "dohyeong", email = "daniel010309@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
