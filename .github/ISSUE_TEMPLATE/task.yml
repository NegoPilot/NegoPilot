name: 작업 (문서·설정·리팩터링)
description: 기능이나 버그가 아닌 문서, 설정, 구조 개선 작업에 사용합니다.
title: "[Task] "
labels: ["task"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 종류
      description: 브랜치 이름 앞부분과 같게 맞춰 주세요.
      options:
        - docs (문서)
        - chore (설정, 의존성, CI)
        - refactor (동작은 그대로, 구조 개선)
        - test (테스트 추가·보강)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 컴포넌트
      options:
        - law-mcp
        - business-mcp
        - mail-mcp
        - agent
        - backend
        - frontend
        - infra
        - 저장소 전체
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 내용
      description: 무엇을, 왜 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
