# Docker Compose 2.24.4+ is required for !override.
# Use both files for config/up/down/logs: -f compose.yaml -f compose.test.yaml.
# COMPOSE_PROJECT_NAME or -p still takes precedence over this project name.
name: negopilot-test

services:
  agent:
    environment:
      AGENT_EXECUTION_MODE: stub
      AGENT_REQUEST_TIMEOUT_SECONDS: "30"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
  backend:
    environment:
      AGENT_EXECUTION_MODE: stub
      AGENT_RESPONSE_TIMEOUT_SECONDS: "35"
      SERVER_SERVLET_SESSION_COOKIE_NAME: NEGOPILOT_TEST_SESSION
  frontend:
    ports: !override
      - "127.0.0.1:${TEST_WEB_PORT:-5174}:80"
